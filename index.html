<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hey Pretty Girl 💓</title>

    <!-- ✅ Favicon -->
    <link rel="icon" href="me.jpg" type="image/jpeg" sizes="32x32">
    <link rel="icon" href="me.jpg" type="image/jpeg" sizes="16x16">
    <link rel="apple-touch-icon" href="me.jpg">


    <!-- Premium Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Background Elements -->
    <div class="particles" id="particles"></div>

    <div class="center">
        <div class="card" id="app">
            <!-- Dynamic pages will be injected here -->
        </div>
    </div>

    <!-- UI Elements -->
    <div class="toggle" id="musicBtn" title="Music">
        <svg viewBox="0 0 24 24" fill="none">
            <path d="M9 18V6l12-2v12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="7" cy="18" r="3" stroke="white" stroke-width="2" />
            <circle cx="19" cy="16" r="3" stroke="white" stroke-width="2" />
            <line x1="3" y1="3" x2="21" y2="21" stroke="white" stroke-width="2.5" stroke-linecap="round"
                class="slashLine" />
        </svg>
    </div>

    <!-- Overlay (Global) -->
    <div class="openOverlay" id="overlay">
        <div class="envelopeAnim" id="env">
            <div class="envTop"></div>
            <div class="envBody"></div>
            <div class="letter"></div>
        </div>
    </div>

    <!-- Audio -->
    <audio id="bgm" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- JS -->
    <script src="js/app.js"></script>
    <script src="js/notebook.js"></script>
</body>

</html>
